<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません｜Milien株式会社</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FDFBF9;
      color: #3A2E28;
      font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
      text-align: center;
    }
    .wrap { padding: 2rem; }
    .code {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 4.5rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #C98F8F;
      margin: 0 0 1rem;
    }
    h1 { font-size: 1.1rem; font-weight: 500; margin: 0 0 0.75rem; }
    p { font-size: 0.85rem; line-height: 1.9; color: #7A6A60; margin: 0 0 2rem; }
    a.btn {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      background: #C98F8F;
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>ページが見つかりませんでした</h1>
    <p>お探しのページは移動または削除された可能性があります。<br>トップページからご覧ください。</p>
    <a class="btn" href="/">トップページへ戻る</a>
  </div>
</body>
</html>
